spring.application.name=spring-batch-sample

spring.main.allow-bean-definition-overriding=true

spring.datasource.jdbcUrl=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
spring.batch.jdbc.initialize-schema=always

spring.datasource.business.jdbcUrl=jdbc:postgresql://localhost:5432/testdb
spring.datasource.business.username=testuser
spring.datasource.business.password=testpass
spring.datasource.business.driverClassName=org.postgresql.Driver
